name: Validate Healthcare market intelligence

on:
  push:
  pull_request:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthcare-data-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build deterministic synthetic Healthcare dataset
        run: >-
          python scripts/seed_demo_data.py
          --database data/healthcare_intelligence.db
          --reset

      - name: Build deterministic Phase 3 intelligence demonstrations
        run: >-
          python scripts/seed_phase3_demo.py
          --database data/healthcare_intelligence.db

      - name: Build deterministic Phase 4 product workflows
        run: >-
          python scripts/seed_phase4_demo.py
          --database data/healthcare_intelligence.db

      - name: Run frozen Phase 5 evaluation tasks
        run: >-
          python scripts/run_evaluation.py
          --database data/healthcare_intelligence.db

      - name: Export and validate CV metrics
        run: >-
          python scripts/export_cv_metrics.py
          --database data/healthcare_intelligence.db
          && python scripts/validate_cv_metrics.py
          --database data/healthcare_intelligence.db

      - name: Validate schema and data integrity
        run: >-
          python scripts/check_data_integrity.py
          --database data/healthcare_intelligence.db

      - name: Run all tests
        run: python -m unittest discover -s tests -v
