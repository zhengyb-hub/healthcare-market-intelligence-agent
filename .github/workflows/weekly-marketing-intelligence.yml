name: Weekly Marketing Intelligence Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: read

jobs:
  build-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build deterministic evaluation dataset
        run: |
          python scripts/seed_demo_data.py --reset
          python scripts/seed_phase3_demo.py
          python scripts/seed_phase4_demo.py

      - name: Generate evidence-grounded marketing digest
        run: python scripts/run_marketing_activation.py --lookback 30

      - name: Validate data integrity
        run: python scripts/check_data_integrity.py

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-marketing-intelligence-digest
          path: outputs/latest_weekly_digest.md
